<!DOCTYPE html>
<html lang="en" color-mode="user">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stratvm Dashboard</title>
	<link rel="stylesheet" href="https://unpkg.com/simpledotcss/simple.min.css">
<body>
	<header>
		<img src="stratvm-white.svg" width=200 height=140>
	</header
	<main>
			<h1>Event query</h1>
			<label>tenant_id: <input id="tenant" value="acme"></label>
			<label>event_type: <input id="type" placeholder="(optional)"></label>
			<label>count: <input id="count" type="number" value="10" min="1" max="100"></label>
			<button id="fetch">Load Events</button>
			<hr>
			<pre id="result"></pre>

	</main>

    <script>
        document.getElementById("fetch").addEventListener("click", async () => {
            const tenant = document.getElementById("tenant").value;
            const type = document.getElementById("type").value;
            const count = document.getElementById("count").value;
            let url = `/api/v1/events?tenant_id=${encodeURIComponent(tenant)}&count=${count}`;
            if (type) url += `&event_type=${encodeURIComponent(type)}`;
            const res = await fetch(url);
            const data = await res.json();
            document.getElementById("result").textContent = JSON.stringify(data, null, 2);
        });
    </script>
</body>
</html>
