<!DOCTYPE html>
<html lang="en" color-mode="user">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stratvm Dashboard</title>
    <style>

over{text-decoration:none}button,.button,a.button,input[type=submit],input[type=reset],input[type=button]{border:var(--border-width)solid var(--accent);background-color:var(--accent);color:var(--accent-text);padding:.5rem .9rem;line-height:normal;text-decoration:none}.button[aria-disabled=true],input:disabled,textarea:disabled,select:disabled,button[disabled]{cursor:not-allowed;background-color:var(--disabled);border-color:var(--disabled);color:var(--text-light)}input[type=range]{padding:0}abbr[title]{cursor:help;text-decoration-line:underline;text-decoration-style:dotted}button:enabled:hover,.button:not([aria-disabled=true]):hover,input[type=submit]:enabled:hover,input[type=reset]:enabled:hover,input[type=button]:enabled:hover{background-color:var(--accent-hover);border-color:var(--accent-hover);cursor:pointer}.button:focus-visible,button:focus-visible:where(:enabled),input:enabled:focus-visible:where([type=submit],[type=reset],[type=button]){outline:2px solid var(--accent);outline-offset:1px}header nav{padding:1rem 0 0;font-size:1rem;line-height:2}header nav ul,header nav ol{flex-flow:wrap;place-content:space-around center;align-items:center;margin:0;padding:0;list-style-type:none;display:flex}header nav ul li,header nav ol li{display:inline-block}header nav a,header nav a:visited{border:var(--border-width)solid var(--border);border-radius:var(--standard-border-radius);color:var(--text);margin:0 .5rem 1rem;padding:.1rem 1rem;text-decoration:none;display:inline-block}header nav a:hover,header nav a.current,header nav a[aria-current=page],header nav a[aria-current=true]{border-color:var(--accent);color:var(--accent);cursor:pointer}@media only screen and (width<=720px){header nav a{border:none;padding:0;line-height:1;text-decoration:underline}}aside,details,pre,progress{background-color:var(--accent-bg);border:var(--border-width)solid var(--border);border-radius:var(--standard-border-radius);margin-bottom:1rem}aside{float:right;width:30%;margin-inline-start:15px;padding:0 15px;font-size:1rem}[dir=rtl] aside{float:left}@media only screen and (width<=720px){aside{float:none;width:100%;margin-inline-start:0}}article,fieldset,dialog{border:var(--border-width)solid var(--border);border-radius:var(--standard-border-radius);margin-bottom:1rem;padding:1rem}article h2:first-child,section h2:first-child,article h3:first-child,section h3:first-child{margin-top:1rem}section{border-top:var(--border-width)solid var(--border);border-bottom:var(--border-width)solid var(--border);margin:3rem 0;padding:2rem 1rem}section+section,section:first-child{border-top:0;padding-top:0}section+section{margin-top:0}section:last-child{border-bottom:0;padding-bottom:0}details{padding:.7rem 1rem}summary{cursor:pointer;word-break:break-all;margin:-.7rem -1rem;padding:.7rem 1rem;font-weight:700}details[open]>summary+*{margin-top:0}details[open]>summary{margin-bottom:.5rem}details[open]>:last-child{margin-bottom:0}table{border-collapse:collapse;margin:1.5rem 0}figure>table{width:max-content;margin:0}td,th{border:var(--border-width)solid var(--border);text-align:start;padding:.5rem}th{background-color:var(--accent-bg);font-weight:700}tr:nth-child(2n){background-color:var(--accent-bg)}table caption{margin-bottom:.5rem;font-weight:700}textarea,select,input,button,.button{font-size:inherit;border-radius:var(--standard-border-radius);box-shadow:none;max-width:100%;margin-bottom:.5rem;padding:.5em;font-family:inherit;display:inline-block}textarea,select,input{color:var(--text);background-color:var(--bg);border:var(--border-width)solid var(--border)}label{display:block}textarea:not([cols]){width:100%}select:not([multiple]){background-image:linear-gradient(45deg,transparent 49%,var(--text)51%),linear-gradient(135deg,var(--text)51%,transparent 49%);background-position:calc(100% - 15px),calc(100% - 10px);background-repeat:no-repeat;background-size:5px 5px,5px 5px;padding-inline-end:25px}[dir=rtl] select:not([multiple]){background-position:10px,15px}input[type=checkbox],input[type=radio]{vertical-align:middle;width:min-content;position:relative}input[type=checkbox]+label,input[type=radio]+label{display:inline-block}input[type=radio]{border-radius:100%}input[type=checkbox]:checked,input[type=radio]:checked{background-color:var(--accent)}input[type=checkbox]:checked:after{content:" ";border-right:solid var(--bg).08em;border-bottom:solid var(--bg).08em;background-color:#0000;border-radius:0;width:.2em;height:.4em;font-size:1.8em;position:absolute;top:.04em;left:.18em;transform:rotate(45deg)}input[type=radio]:checked:after{content:" ";background-color:var(--bg);border-radius:100%;width:.3em;height:.3em;font-size:1.8em;position:absolute;top:.125em;left:.125em}@media only screen and (width<=720px){textarea,select,input{width:100%}}input[type=color]{height:2.5rem;padding:.2rem}input[type=file]{border:0}hr{height:var(--border-width);background:var(--border);border:none;margin:1rem auto}mark{border-radius:var(--standard-border-radius);background-color:var(--marked);color:#000;padding:2px 5px}mark a{color:#0d47a1}a[href^=http]:after{content:" <" attr(href)">"}abbr[title]:after{content:" (" attr(title)")"}a{text-decoration:none}p{widows:3;orphans:3}hr{border-top:var(--border-width)solid var(--border)}mark{border:var(--border-width)solid var(--border)}pre,table,figure,img,svg{break-inside:avoid}pre code{white-space:pre-wrap}}
    </style>
    <style>
        body { padding: 1rem; }
        details {
            padding: 0.5rem;
        }
        summary {
            cursor: pointer;
            list-style: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        summary::before {
            content: '▸';
            display: inline-block;
            transition: transform 0.15s;
        }
        details[open] summary::before {
            transform: rotate(90deg);
        }
        .event-header {
            font-family: monospace;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        pre {
            margin: 0.5rem 0 0 1.5rem;
            padding: 0.5rem;
            background: #f5f5f5;
            border-radius: 4px;
            font-size: 0.85rem;
            overflow-x: auto;
        }
        .json-key {
            color: #0366d6;
            font-weight: 600;
        }
    </style>
</head>
<body>
	<header>
		<img src="stratvm-white.svg" width=200 height=140>
	</header>
	<main>
			<h1>Event query</h1>
			<label>tenant_id: <input id="tenant" value="acme"></label>
			<label>event_type: <input id="type" placeholder="(optional)"></label>
			<label>count: <input id="count" type="number" value="10" min="1" max="100"></label>
			<button id="fetch">Load Events</button>
			<hr>
			<div id="result"></div>

	</main>

    <script>
        function renderJSON(obj, indent = 2) {
            if (obj === null || typeof obj !== 'object') return JSON.stringify(obj);
            const entries = Object.entries(obj);
            if (entries.length === 0) return '{}';
            let html = '<div style="margin-left: 1.5rem;">';
            entries.forEach(([key, value]) => {
                if (typeof value === 'object' && value !== null) {
                    html += `<details open><summary><span class="json-key">"${key}"</span></summary>${renderJSON(value, indent + 2)}</details>`;
                } else {
                    const formatted = Array.isArray(value) ? renderJSON(value, indent) : JSON.stringify(value);
                    html += `<div><span class="json-key">"${key}"</span>: ${formatted}</div>`;
                }
            });
            html += '</div>';
            return html;
        }

        function renderEvents(events) {
            if (!events.length) return '<p>No events found.</p>';
            return events.map((event, idx) => `
                <details>
                    <summary>
                        <span style="width:100%; text-align: right; color: #666; font-size: 0.8rem; font-weight: 400;">${event.received_at}</span>
                        <span style="width:100%;" class="event-header">${event.event_type}</span>
                    </summary>
                    <pre style="background: black">${renderJSON(event)}</pre>
                </details>
            `).join('');
        }

        document.getElementById("fetch").addEventListener("click", async () => {
            const tenant = document.getElementById("tenant").value;
            const type = document.getElementById("type").value;
            const count = document.getElementById("count").value;
            let url = `/api/v1/events?tenant_id=${encodeURIComponent(tenant)}&count=${count}`;
            if (type) url += `&event_type=${encodeURIComponent(type)}`;
            try {
                const res = await fetch(url);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                document.getElementById("result").innerHTML = renderEvents(data);
            } catch (err) {
                document.getElementById("result").innerHTML = `<p style="color: red;">Error: ${err.message}</p>`;
            }
        });
    </script>
</body>
</html>
