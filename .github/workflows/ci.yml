name: CI

on:
  push:
    branches: [main]
    paths:
      - '.github/**'
      - 'shared/**'
      - 'api/**'
      - 'worker/**'
      - 'dashboard/**'
      - 'k8s/**'

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: samyponsar

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff format check
        run: ruff format --check .

      - name: Run ruff check
        run: ruff check .

  kube-score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download kube-score
        run: |
          URL=$(curl -s https://api.github.com/repos/zegl/kube-score/releases/latest | python3 -c "import sys,json; r=json.load(sys.stdin); print([a['browser_download_url'] for a in r['assets'] if 'linux_amd64' in a['name'] and not a['name'].endswith('.tar.gz')][0])")
          curl -sL "$URL" -o kube-score
          chmod +x kube-score

      - name: Score K8s manifests
        run: ./kube-score score k8s/*

  build-and-scan:
    needs: [lint, kube-score]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push api
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./api/Containerfile
          outputs: type=registry
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/api:main

      - name: Scan api
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/api:main
          format: table
          exit-code: 1
          severity: HIGH,CRITICAL

      - name: Build and push worker
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./worker/Containerfile
          outputs: type=registry
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/worker:main

      - name: Scan worker
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/worker:main
          format: table
          exit-code: 1
          severity: HIGH,CRITICAL

      - name: Build and push dashboard
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./dashboard/Containerfile
          outputs: type=registry
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/dashboard:main

      - name: Scan dashboard
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/dashboard:main
          format: table
          exit-code: 1
          severity: HIGH,CRITICAL
