name: Build

on:
  push:
    branches: [main]
    paths:
      - 'shared/**'
      - 'api/**'
      - 'worker/**'
      - 'dashboard/**'
      - 'Containerfile'

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: samyponsar

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./api/Containerfile
          outputs: type=registry
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/api:latest

      - name: Build and push worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./worker/Containerfile
          outputs: type=registry
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/worker:latest

      - name: Build and push dashboard
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./dashboard/Containerfile
          outputs: type=registry
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/dashboard:latest
