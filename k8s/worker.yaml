apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: stratvm
  name: worker-deployment
  labels:
    app: worker
spec:
  replicas: 3
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      automountServiceAccountToken: false
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: worker
              topologyKey: kubernetes.io/hostname
      containers:
      - name: worker
        image: ghcr.io/samyponsar/worker:main
        imagePullPolicy: Always
        securityContext:
          runAsNonRoot: true
          runAsUser: 65534
          runAsGroup: 65534
          readOnlyRootFilesystem: true
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
            ephemeral-storage: 50Mi
          limits:
            cpu: 300m
            memory: 256Mi
            ephemeral-storage: 100Mi
        livenessProbe:
          exec:
            command:
            - sh
            - -c
            - echo ok
          initialDelaySeconds: 10
          periodSeconds: 15
        env:
        - name: POSTGRES_HOST
          valueFrom:
            configMapKeyRef:
              name: stratvm-config
              key: POSTGRES_HOST
        - name: POSTGRES_PORT
          valueFrom:
            configMapKeyRef:
              name: stratvm-config
              key: POSTGRES_PORT
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: stratvm-config
              key: POSTGRES_DB
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: stratvm-secret
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: stratvm-secret
              key: POSTGRES_PASSWORD
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: stratvm-config
              key: REDIS_HOST
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: stratvm-config
              key: REDIS_PORT
        - name: REDIS_USER
          valueFrom:
            secretKeyRef:
              name: stratvm-secret
              key: WORKER_REDIS_USER
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: stratvm-secret
              key: WORKER_REDIS_PASSWORD
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  namespace: stratvm
  name: worker-networkpolicy
spec:
  podSelector:
    matchLabels:
      app: worker
  policyTypes:
  - Ingress
  - Egress
  ingress: []
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: redis
    ports:
    - protocol: TCP
      port: 6379
  - to:
    - podSelector:
        matchLabels:
          app: postgres
    ports:
    - protocol: TCP
      port: 5432
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: worker-pdb
  namespace: stratvm
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: worker
