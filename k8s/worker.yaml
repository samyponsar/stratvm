apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: stratvm
  name: worker-deployment
  labels:
    app: worker
spec:
  replicas: 3
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      automountServiceAccountToken: false
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: worker
              topologyKey: kubernetes.io/hostname
      containers:
      - name: worker
        image: ghcr.io/samyponsar/worker:main
        imagePullPolicy: Always
        securityContext:
          runAsNonRoot: true
          runAsUser: 65534
          runAsGroup: 65534
          readOnlyRootFilesystem: true
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
            ephemeral-storage: 50Mi
          limits:
            cpu: 300m
            memory: 256Mi
            ephemeral-storage: 100Mi
        livenessProbe:
          exec:
            command:
            - sh
            - -c
            - /app/.venv/bin/python -c "import os, redis; r=redis.Redis(host=os.environ['REDIS_HOST'],port=int(os.environ['REDIS_PORT']),username=os.environ['REDIS_USER'],password=os.environ['REDIS_PASSWORD']); print(r.ping())"
          initialDelaySeconds: 60
          timeoutSeconds: 5
          periodSeconds: 30
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - /app/.venv/bin/python -c "import os, redis, psycopg; r=redis.Redis(host=os.environ['REDIS_HOST'],port=int(os.environ['REDIS_PORT']),username=os.environ['REDIS_USER'],password=os.environ['REDIS_PASSWORD']); r.ping(); c=psycopg.connect(conninfo='dbname='+os.environ['POSTGRES_DB']+' user='+os.environ['POSTGRES_USER']+' password='+os.environ['POSTGRES_PASSWORD']+' host='+os.environ['POSTGRES_HOST']+' port='+os.environ['POSTGRES_PORT']); c.close()"
          initialDelaySeconds: 45
          timeoutSeconds: 5
          periodSeconds: 20
          failureThreshold: 3
        env:
        - name: POSTGRES_HOST
          valueFrom:
            configMapKeyRef:
              name: stratvm-config
              key: POSTGRES_HOST
        - name: POSTGRES_PORT
          valueFrom:
            configMapKeyRef:
              name: stratvm-config
              key: POSTGRES_PORT
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: stratvm-config
              key: POSTGRES_DB
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: stratvm-secret
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: stratvm-secret
              key: POSTGRES_PASSWORD
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: stratvm-config
              key: REDIS_HOST
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: stratvm-config
              key: REDIS_PORT
        - name: REDIS_USER
          valueFrom:
            secretKeyRef:
              name: stratvm-secret
              key: WORKER_REDIS_USER
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: stratvm-secret
              key: WORKER_REDIS_PASSWORD
        volumeMounts:
        - name: uv-cache
          mountPath: /.cache
      volumes:
      - name: uv-cache
        emptyDir: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  namespace: stratvm
  name: worker-networkpolicy
spec:
  podSelector:
    matchLabels:
      app: worker
  policyTypes:
  - Ingress
  - Egress
  ingress: []
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: redis
    ports:
    - protocol: TCP
      port: 6379
  - to:
    - podSelector:
        matchLabels:
          app: postgres
    ports:
    - protocol: TCP
      port: 5432
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: worker-pdb
  namespace: stratvm
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: worker
