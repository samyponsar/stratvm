apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: postgres
  name: postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - image: postgres:18-alpine
        name: postgres
        env:
        - name: POSTGRES_HOST_AUTH_METHOD
          value: "trust"
        ports:
        - containerPort: 5432
        volumeMounts:
        - name: init
          mountPath: /docker-entrypoint-initdb.d
          readOnly: true
        - name: db
          mountPath: /var/lib/postgresql/18/docker
      volumes:
      - name: init
        configMap:
          name: postgres
      - name: db
        persistentVolumeClaim:
          claimName: postgres
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres
data:
  init.sql: |
    CREATE TABLE events (
        time              TEXT
    );
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: postgres
  ports:
  - port: 5432
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres
spec:
  accessModes:
    - ReadWriteOncePod
  resources:
    requests:
      storage: 8Gi