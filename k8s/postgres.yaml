apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: stratvm
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: stratvm
  name: postgres-deployment
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
      annotations:
        kube-score/ignore: container-security-context-readonlyrootfilesystem,container-security-context-user-group-id
    spec:
      automountServiceAccountToken: false
      containers:
      - name: postgres
        image: docker.io/library/postgres:18-alpine
        imagePullPolicy: Always
        securityContext:
          runAsNonRoot: true
          runAsUser: 999
          runAsGroup: 999
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
            ephemeral-storage: 50Mi
          limits:
            cpu: 500m
            memory: 512Mi
            ephemeral-storage: 100Mi
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: stratvm-secret
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: stratvm-secret
              key: POSTGRES_PASSWORD
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: stratvm-config
              key: POSTGRES_DB
        livenessProbe:
          tcpSocket:
            port: 5432
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          exec:
            command:
            - test
            - -S
            - /var/run/postgresql/.s.PGSQL.5432
          initialDelaySeconds: 10
          periodSeconds: 10
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql
        - name: init
          mountPath: /docker-entrypoint-initdb.d/init.sql
          subPath: postgres_init.sql
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: postgres-data
        persistentVolumeClaim:
          claimName: postgres-pvc
      - name: init
        configMap:
          name: postgres-init
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  namespace: stratvm
  name: postgres-service
spec:
  selector:
    app: postgres
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: ConfigMap
metadata:
  namespace: stratvm
  name: postgres-init
data:
  postgres_init.sql: |
    CREATE TABLE events (
        id              BIGSERIAL PRIMARY KEY,
        tenant_id       VARCHAR(64) NOT NULL,
        event_type      VARCHAR(128) NOT NULL,
        received_at     TIMESTAMPTZ NOT NULL,
        processed_at    TIMESTAMPTZ NOT NULL,
        committed_at    TIMESTAMPTZ NOT NULL,
        payload         JSONB,
        metadata        JSONB
    );
    CREATE INDEX idx_events_tenant_id ON events (tenant_id);
    CREATE INDEX idx_events_tenant_event_type ON events (tenant_id, event_type);
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  namespace: stratvm
  name: postgres-networkpolicy
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: api
    - podSelector:
        matchLabels:
          app: worker
    ports:
    - protocol: TCP
      port: 5432
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: postgres-pdb
  namespace: stratvm
spec:
  maxUnavailable: 0
  selector:
    matchLabels:
      app: postgres
