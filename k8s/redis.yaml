apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: stratvm
  name: redis-deployment
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      automountServiceAccountToken: false
      containers:
      - name: redis
        image: docker.io/library/redis:8-alpine
        imagePullPolicy: Always
        command: ["redis-server", "--aclfile", "/etc/redis/acl.conf"]
        securityContext:
          runAsNonRoot: true
          runAsUser: 65534
          runAsGroup: 65534
          readOnlyRootFilesystem: true
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
            ephemeral-storage: 25Mi
          limits:
            cpu: 150m
            memory: 128Mi
            ephemeral-storage: 50Mi
        livenessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          tcpSocket:
            port: 6379
          initialDelaySeconds: 10
          periodSeconds: 10
        ports:
        - containerPort: 6379
        volumeMounts:
        - name: acl
          mountPath: /etc/redis/acl.conf
          subPath: acl.conf
      volumes:
      - name: acl
        configMap:
          name: redis-acl
---
apiVersion: v1
kind: Service
metadata:
  namespace: stratvm
  name: redis-service
spec:
  selector:
    app: redis
  ports:
    - protocol: TCP
      port: 6379
      targetPort: 6379
---
apiVersion: v1
kind: ConfigMap
metadata:
  namespace: stratvm
  name: redis-acl
data:
  acl.conf: |
    user default off
    user admin on >admin ~* &* +@all
    user api on >api ~* &* +LPUSH +@connection
    user worker on >worker ~* &* +BRPOP +@connection
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  namespace: stratvm
  name: redis-networkpolicy
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: api
    - podSelector:
        matchLabels:
          app: worker
    ports:
    - protocol: TCP
      port: 6379
  egress: []
