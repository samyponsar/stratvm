apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-deployment
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      automountServiceAccountToken: false
      containers:
      - name: redis
        image: docker.io/library/redis:8-alpine
        command: ["redis-server", "--aclfile", "/etc/redis/acl.conf"]
        ports:
        - containerPort: 6379
        volumeMounts:
        - name: acl
          mountPath: /etc/redis/acl.conf
          subPath: acl.conf
      volumes:
      - name: acl
        configMap:
          name: redis-acl
---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
spec:
  selector:
    app: redis
  ports:
    - protocol: TCP
      port: 6379
      targetPort: 6379
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-acl
data:
  acl.conf: |
    user default off
    user admin on >admin ~* &* +@all
    user api on >api ~* &* +LPUSH +@connection
    user worker on >worker ~* &* +BRPOP +@connection
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-networkpolicy
  namespace: stratvm
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: api
    - podSelector:
        matchLabels:
          app: worker
    ports:
    - protocol: TCP
      port: 6379
  egress: []
